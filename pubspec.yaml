name: dnd_sheet_archive
description: >-
  Archivio di schede personaggio D&D 5e con cronologia delle versioni e
  sincronizzazione su Google Drive.
publish_to: 'none'

version: 1.3.1+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  crypto: ^3.0.7
  image: ^4.10.1
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1
  path_provider: ^2.1.6
  uuid: ^4.5.3
  intl: ^0.20.3
  path: ^1.9.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  file_picker: ^8.1.7
  pdf: ^3.12.0
  web: ^1.1.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sheet/
    - assets/fonts/RobotoSlab-Regular.ttf
    - assets/fonts/licenses/
  fonts:
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-VariableFont_wght.ttf
