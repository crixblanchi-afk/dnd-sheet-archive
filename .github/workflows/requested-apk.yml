name: Build requested Android APK
on:
  push:
    branches: [codex/apk-dark-20260924]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: release
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVER_CLIENT_ID"
          keystore_path="$RUNNER_TEMP/dnd-sheet-archive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: |
          flutter build apk --release --build-name=1.0.2 --build-number=3 \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk dnd-sheet-archive-v1.0.2-android.apk
          sha256sum dnd-sheet-archive-v1.0.2-android.apk
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-android-apk
          path: dnd-sheet-archive-v1.0.2-android.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dnd-sheet-archive-release.jks"
