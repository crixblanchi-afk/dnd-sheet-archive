name: Build release

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: release
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/dnd-sheet-archive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dnd-sheet-archive-${{ github.event.release.tag_name }}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dnd-sheet-archive-${{ github.event.release.tag_name }}-android.apk
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build AppImage
        run: |
          flutter pub get
          ./scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: dist/*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1

  linux-arm64:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/cirruslabs/flutter:3.41.9
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install --yes \
            binutils \
            ca-certificates \
            clang \
            cmake \
            curl \
            desktop-file-utils \
            file \
            libgtk-3-dev \
            libstdc++-12-dev \
            liblzma-dev \
            lld \
            llvm \
            ninja-build \
            patchelf \
            pkg-config

      - name: Build ARM64 AppImage
        run: |
          flutter precache --linux
          flutter pub get
          ./scripts/build_appimage.sh

      - name: Upload ARM64 AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-arm64
          path: dist/*-aarch64.AppImage
          if-no-files-found: error
          retention-days: 1

  web:
    needs: test
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: >-
        ${{ github.event_name == 'release' && secrets.GOOGLE_WEB_CLIENT_ID || '' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build Web application
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Package Web application
        if: github.event_name == 'release'
        run: |
          safe_tag="${RELEASE_TAG//\//-}"
          archive="dnd-sheet-archive-$safe_tag-web.tar.gz"
          tar -C build/web -czf "$archive" .
          echo "WEB_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload Web archive artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: ${{ env.WEB_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: test
    runs-on: windows-latest
    env:
      GOOGLE_DESKTOP_CLIENT_ID: >-
        ${{ github.event_name == 'release' && secrets.GOOGLE_DESKTOP_CLIENT_ID || '' }}
      GOOGLE_DESKTOP_CLIENT_SECRET: >-
        ${{ github.event_name == 'release' && secrets.GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build Windows application
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release `
            --dart-define="GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID" `
            --dart-define="GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Package Windows application
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $redistVersion = (
            Get-Content "$visualStudio\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          ).Trim()
          $crtDirectory = (
            "$visualStudio\VC\Redist\MSVC\$redistVersion\x64\Microsoft.VC143.CRT"
          )
          $releaseDirectory = 'build/windows/x64/runner/Release'
          $runtimeLibraries = @(
            "$crtDirectory/msvcp140.dll"
            "$crtDirectory/vcruntime140.dll"
            "$crtDirectory/vcruntime140_1.dll"
          )
          Copy-Item -Path $runtimeLibraries -Destination $releaseDirectory

          $safeTag = $env:RELEASE_TAG -replace '[\\/:*?"<>|]', '-'
          $archive = "dnd-sheet-archive-$safeTag-windows-x64.zip"
          Compress-Archive `
            -Path "$releaseDirectory/*" `
            -DestinationPath $archive
          "WINDOWS_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload Windows archive artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: ${{ env.WINDOWS_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  publish-release-assets:
    needs: [android, linux, linux-arm64, web, windows]
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-assets/*
          --clobber
