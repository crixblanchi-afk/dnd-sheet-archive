name: Build release

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    needs: test
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: release
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/dnd-sheet-archive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dnd-sheet-archive-${{ github.event.release.tag_name }}-android.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "dnd-sheet-archive-${{ github.event.release.tag_name }}-android.apk"
          --clobber

  linux:
    needs: test
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build AppImage
        run: |
          flutter pub get
          ./scripts/build_appimage.sh

      - name: Attach AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/*.AppImage
          --clobber

  linux-arm64:
    needs: test
    if: >-
      github.event_name == 'release' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build ARM64 AppImage
        run: |
          flutter pub get
          ./scripts/build_appimage.sh

      - name: Attach ARM64 AppImage to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/*-aarch64.AppImage
          --clobber

  web:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build Web application
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Package Web application
        if: github.event_name == 'release'
        run: |
          safe_tag="${RELEASE_TAG//\//-}"
          archive="dnd-sheet-archive-$safe_tag-web.tar.gz"
          tar -C build/web -czf "$archive" .
          echo "WEB_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Attach Web archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$WEB_ARCHIVE"
          --clobber

  windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Build Windows application
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release `
            --dart-define="GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID" `
            --dart-define="GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Package Windows application
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $redistVersion = (
            Get-Content "$visualStudio\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          ).Trim()
          $crtDirectory = (
            "$visualStudio\VC\Redist\MSVC\$redistVersion\x64\Microsoft.VC143.CRT"
          )
          $releaseDirectory = 'build/windows/x64/runner/Release'
          $runtimeLibraries = @(
            "$crtDirectory/msvcp140.dll"
            "$crtDirectory/vcruntime140.dll"
            "$crtDirectory/vcruntime140_1.dll"
          )
          Copy-Item -Path $runtimeLibraries -Destination $releaseDirectory

          $safeTag = $env:RELEASE_TAG -replace '[\\/:*?"<>|]', '-'
          $archive = "dnd-sheet-archive-$safeTag-windows-x64.zip"
          Compress-Archive `
            -Path "$releaseDirectory/*" `
            -DestinationPath $archive
          "WINDOWS_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Attach Windows archive to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$env:RELEASE_TAG"
          "$env:WINDOWS_ARCHIVE"
          --clobber
